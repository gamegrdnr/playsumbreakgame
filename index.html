<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Sum Break: merge matching numbered circles until only one is left. 100 levels.">
<title>Sum Break</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='14' cy='20' r='11' fill='%232F5BEA'/%3E%3Ccircle cx='26' cy='20' r='11' fill='%23F29E1F' fill-opacity='.9'/%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --mode:light;
  --bg:#E8ECF2;
  --panel:#F7F9FC;
  --tray:#D2D9E4;
  --socket:#C0CAD8;
  --sock-shade:rgba(30,42,60,.24);
  --edge:rgba(255,255,255,.7);
  --ink:#172033;
  --ink-soft:#56627A;
  --line:#C3CCD9;
  --accent:#2F5BEA;
  --accent-ink:#FFFFFF;
  --hint:#E8910F;
  --warn:#C23B22;
  --wild-bg:#172033;
  --wild-fg:#FFFFFF;
  --wild-ring:#F2A93B;
  --shadow:rgba(23,32,51,.24);
  --scrim:rgba(23,32,51,.46);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --mode:dark;
    --bg:#121826;
    --panel:#1B2335;
    --tray:#1E2840;
    --socket:#141B2B;
    --sock-shade:rgba(0,0,0,.55);
    --edge:rgba(255,255,255,.05);
    --ink:#E8EDF6;
    --ink-soft:#9BA7BE;
    --line:#2F3B56;
    --accent:#7D98FF;
    --accent-ink:#0E1424;
    --hint:#FFB547;
    --warn:#FF8A73;
    --wild-bg:#E8EDF6;
    --wild-fg:#121826;
    --wild-ring:#E8910F;
    --shadow:rgba(0,0,0,.5);
    --scrim:rgba(5,8,15,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --mode:dark;
  --bg:#121826;
  --panel:#1B2335;
  --tray:#1E2840;
  --socket:#141B2B;
  --sock-shade:rgba(0,0,0,.55);
  --edge:rgba(255,255,255,.05);
  --ink:#E8EDF6;
  --ink-soft:#9BA7BE;
  --line:#2F3B56;
  --accent:#7D98FF;
  --accent-ink:#0E1424;
  --hint:#FFB547;
  --warn:#FF8A73;
  --wild-bg:#E8EDF6;
  --wild-fg:#121826;
  --wild-ring:#E8910F;
  --shadow:rgba(0,0,0,.5);
  --scrim:rgba(5,8,15,.62);
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
html.lock body{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{height:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:10px max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand{display:flex;align-items:center;gap:8px;margin:0;font-size:1.4rem;font-weight:800;letter-spacing:-.025em}
.brand svg{width:30px;height:30px;flex:none}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700;cursor:pointer}
.pill svg{width:18px;height:18px}

.hud{display:flex;align-items:center;gap:4px;min-height:44px}
.nav{width:38px;height:38px;flex:none;border:0;border-radius:50%;background:transparent;color:var(--ink-soft);cursor:pointer;display:grid;place-items:center}
.nav svg{width:20px;height:20px}
.nav:disabled{opacity:.28;cursor:default}
.lvl{display:flex;align-items:center;gap:8px;min-width:0}
.lvl strong{font-size:1.2rem;font-weight:800;letter-spacing:-.015em;white-space:nowrap}
.size{font-size:.8rem;font-weight:700;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.tick{color:var(--accent);font-weight:900}
.stats{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.timer{font-size:1.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.moves{font-size:.8rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}

.stage{flex:1 1 auto;min-height:220px;display:flex;align-items:center;justify-content:center}
.tray{width:300px;height:300px;padding:2.4%;border-radius:24px;background:var(--tray);box-shadow:inset 0 2px 7px var(--sock-shade),0 1px 0 var(--edge)}
.grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(var(--n,3),1fr);grid-template-rows:repeat(var(--n,3),1fr);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cell{position:relative}
.cell::before{content:"";position:absolute;inset:11%;border-radius:50%;background:var(--socket);box-shadow:inset 0 2px 4px var(--sock-shade)}
.tile{position:absolute;inset:4.5%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.04em;line-height:1;font-size:calc(var(--cell,40px)*.44);cursor:grab;transition:transform .14s ease,box-shadow .14s ease}
.tile.num{background:radial-gradient(circle at 34% 27%,rgba(255,255,255,.42),rgba(255,255,255,0) 56%),var(--c);color:var(--fg);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 2px 5px var(--shadow)}
.tile[data-d="3"]{font-size:calc(var(--cell,40px)*.36)}
.tile[data-d="4"]{font-size:calc(var(--cell,40px)*.31)}
.tile[data-d="5"],.tile[data-d="6"],.tile[data-d="7"]{font-size:calc(var(--cell,40px)*.22)}
.tile.wild{background:var(--wild-bg);color:var(--wild-fg);font-size:calc(var(--cell,40px)*.34);letter-spacing:-.02em;box-shadow:0 2px 5px var(--shadow)}
.tile.wild::before{content:"";position:absolute;inset:8%;border-radius:50%;border:2px dashed var(--wild-ring)}
.tile.empty{visibility:hidden;transition:none}
.tile.sel{transform:scale(1.07);box-shadow:0 0 0 3px var(--tray),0 0 0 6px var(--accent),0 6px 14px var(--shadow)}
.tile.target::after{content:"";position:absolute;inset:-7%;border-radius:50%;border:2.5px solid var(--accent);opacity:.6}
.tile.over{transform:scale(1.12)}
.tile.over::after{opacity:1}
.tile.dragging{z-index:5;transition:none;cursor:grabbing;box-shadow:0 0 0 3px var(--tray),0 0 0 6px var(--accent),0 12px 24px var(--shadow)}
.tile.moving{z-index:4;transition:transform .13s ease-in}
.tile.pop{animation:pop .24s cubic-bezier(.2,.9,.3,1.35)}
.tile.hint-from,.tile.hint-to{animation:pulse 1.1s ease-in-out infinite}
.tile.hint-from::after,.tile.hint-to::after{content:"";position:absolute;inset:-8%;border-radius:50%;border:3px solid var(--hint)}
.tile.hint-to::after{border-style:dashed}
@keyframes pop{0%{transform:scale(.78)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

.status{margin:0;min-height:2.7em;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 6px;font-size:.92rem;line-height:1.3;color:var(--ink-soft)}
.status.warn{color:var(--warn);font-weight:700}
.status.hint{color:var(--ink)}
.status.good{color:var(--accent);font-weight:800}

.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:52px;padding:0 10px;border-radius:16px;border:1px solid var(--line);background:var(--panel);font-weight:750;font-size:1rem;cursor:pointer}
.btn svg{width:20px;height:20px;flex:none}
.btn:disabled{opacity:.42;cursor:default}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.busy svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet[hidden]{display:none}
.sheet-head{width:100%;max-width:600px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.sheet-head h2{margin:0;font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
.sheet-head p{margin:2px 0 0;font-size:.9rem;color:var(--ink-soft)}
.sheet-head .pill{margin-left:auto}
.sheet-body{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet-inner{max-width:600px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.band h3{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px;font-size:1.05rem;font-weight:800}
.band small{font-size:.85rem;font-weight:600;color:var(--ink-soft)}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:9px}
.dot{position:relative;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);font-weight:800;font-size:.95rem;font-variant-numeric:tabular-nums;cursor:pointer;padding:0}
.dot.done{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.dot.current{box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--hint)}
.dot i{position:absolute;top:-3px;right:-3px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.72rem;font-weight:900;background:var(--panel);color:var(--accent);border:1.5px solid var(--accent)}

.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:var(--scrim)}
.overlay[hidden]{display:none}
.card{width:min(360px,100%);padding:26px 22px 18px;border-radius:26px;background:var(--panel);text-align:center;box-shadow:0 22px 60px rgba(0,0,0,.3)}
.card svg{width:56px;height:56px}
.card h2{margin:10px 0 4px;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.card p{margin:2px 0;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.card .actions{display:grid;gap:8px;margin-top:18px}

@media (prefers-reduced-motion:reduce){
  .tile,.tile.moving{transition:none}
  .tile.pop,.tile.hint-from,.tile.hint-to,.btn.busy svg{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1 class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="14" cy="20" r="11" fill="var(--accent)"/><circle cx="26" cy="20" r="11" fill="var(--hint)" fill-opacity=".9"/></svg>Sum Break</h1>
    <button class="pill" id="levels" type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="6" cy="6" r="2.4"/><circle cx="12" cy="6" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="6" cy="12" r="2.4"/><circle cx="12" cy="12" r="2.4"/><circle cx="18" cy="12" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="12" cy="18" r="2.4"/><circle cx="18" cy="18" r="2.4"/></svg>Levels</button>
  </header>
  <div class="hud">
    <button class="nav" id="prev" type="button" aria-label="Previous level"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="lvl"><strong id="lvl">Level 1</strong><span class="size" id="size">3×3</span><span class="tick" id="tick" hidden aria-label="solved">✓</span></div>
    <button class="nav" id="next" type="button" aria-label="Next level"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="stats"><span class="timer" id="timer" aria-label="Time">0:00</span><span class="moves" id="moves">0 moves</span></div>
  </div>
  <main class="stage" id="stage">
    <div class="tray" id="tray"><div class="grid" id="grid" aria-label="Board"></div></div>
  </main>
  <p class="status" id="status" aria-live="polite"></p>
  <nav class="controls" aria-label="Game controls">
    <button class="btn" id="undo" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>Undo</button>
    <button class="btn" id="restart" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Restart</button>
    <button class="btn primary" id="hint" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0012 2z"/></svg>Hint</button>
  </nav>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head">
    <div><h2 id="sheetTitle">Levels</h2><p id="sheetCount"></p></div>
    <button class="pill" id="sheetClose" type="button">Close</button>
  </div>
  <div class="sheet-body"><div class="sheet-inner" id="sheetList"></div></div>
</div>

<div class="overlay" id="win" role="dialog" aria-modal="true" aria-labelledby="winTitle" hidden>
  <div class="card">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="var(--accent)"/><path d="M13 20.5l5 5 9-10" fill="none" stroke="var(--accent-ink)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h2 id="winTitle">Solved</h2>
    <p id="winTime"></p>
    <p id="winBest"></p>
    <div class="actions">
      <button class="btn primary" id="winNext" type="button">Next level</button>
      <button class="btn" id="winAgain" type="button">Play again</button>
    </div>
  </div>
</div>

<script>
/*ENGINE:BEGIN*/
var Engine = (function () {
  'use strict';
  // Cell codes: 0 = empty, >0 = number, <0 = wildcard.
  var MAX = 9999;
  var WILD_LABEL = { '-1': '+1', '-2': '+2', '-3': '+3', '-4': '\u00d72', '-5': '\u00d73' };
  var NB = {};

  function nbrs(n) {
    if (NB[n]) return NB[n];
    var out = [];
    for (var i = 0; i < n * n; i++) {
      var r = (i / n) | 0, c = i % n, l = [];
      if (r > 0) l.push(i - n);
      if (c < n - 1) l.push(i + 1);
      if (r < n - 1) l.push(i + n);
      if (c > 0) l.push(i - 1);
      out.push(l);
    }
    NB[n] = out;
    return out;
  }
  function op(w, x) {
    switch (w) {
      case -1: return x + 1;
      case -2: return x + 2;
      case -3: return x + 3;
      case -4: return x * 2;
      case -5: return x * 3;
    }
    return NaN;
  }
  function canMerge(a, b) {
    if (!a || !b) return false;
    if (a > 0 && b > 0) return a === b;
    return (a > 0) !== (b > 0); // a wildcard merges with any number, never with another wildcard
  }
  function mergeValue(a, b) {
    if (a > 0 && b > 0) return a + b;
    return a < 0 ? op(a, b) : op(b, a);
  }
  function adjacent(n, a, b) {
    var d = a > b ? a - b : b - a;
    if (d === n) return true;
    return d === 1 && ((a / n) | 0) === ((b / n) | 0);
  }
  function legal(c, n, a, b) {
    var s = n * n;
    return a >= 0 && b >= 0 && a < s && b < s && a !== b && adjacent(n, a, b) && canMerge(c[a], c[b]);
  }
  // Drag a onto b: the result lands in b, a becomes empty, nothing slides in.
  function apply(c, a, b) {
    var d = c.slice();
    d[b] = mergeValue(c[a], c[b]);
    d[a] = 0;
    return d;
  }
  function count(c) {
    var k = 0;
    for (var i = 0; i < c.length; i++) if (c[i]) k++;
    return k;
  }
  function moves(c, n) {
    var nb = nbrs(n), out = [];
    for (var i = 0; i < c.length; i++) {
      if (!c[i]) continue;
      var l = nb[i];
      for (var k = 0; k < l.length; k++) if (canMerge(c[i], c[l[k]])) out.push([i, l[k]]);
    }
    return out;
  }
  function hasMove(c, n) {
    var nb = nbrs(n);
    for (var i = 0; i < c.length; i++) {
      if (c[i] <= 0) continue;
      var l = nb[i];
      for (var k = 0; k < l.length; k++) if (canMerge(c[i], c[l[k]])) return true;
    }
    return false;
  }
  // Values only ever grow and emptied cells never refill. That gives cheap proofs that a
  // position is dead:
  //  - the circles have split into two groups that can never meet again;
  //  - a number whose neighbours are all bigger numbers can never find a partner;
  //  - a smallest number can only pair with an adjacent equal number or an adjacent wildcard,
  //    and two smallest numbers cannot share one partner, so they need a matching;
  //  - with no wildcards left, every value has to pair up evenly (like binary carries).
  var B = null;
  function scratch(size) {
    if (!B || B.size < size || B.vs > 1e9 || B.os > 1e9 || B.ss > 1e9) {
      var z = Math.max(size, B ? B.size : 0);
      B = {
        size: z, seen: new Int32Array(z), ss: 0, stack: new Int32Array(z),
        owner: new Int32Array(z), own: new Int32Array(z), os: 0, vis: new Int32Array(z), vs: 0,
        cand: new Int32Array(z * 4), cn: new Int32Array(z), mins: new Int32Array(z)
      };
    }
    return B;
  }
  function augment(x) {
    var base = x * 4, cnt = B.cn[x];
    for (var q = 0; q < cnt; q++) {
      var y = B.cand[base + q];
      if (B.vis[y] === B.vs) continue;
      B.vis[y] = B.vs;
      if (B.own[y] !== B.os || augment(B.owner[y])) { B.own[y] = B.os; B.owner[y] = x; return true; }
    }
    return false;
  }
  function isDead(c, n) {
    var nb = nbrs(n), size = c.length, tiles = 0, nums = 0, wild = 0, first = -1, m = Infinity, i, k, l, v, w;
    for (i = 0; i < size; i++) {
      v = c[i];
      if (!v) continue;
      tiles++;
      if (v > 0) { nums++; if (v < m) m = v; } else wild++;
      if (first < 0) first = i;
    }
    if (tiles <= 1) return false;
    if (!nums) return true;
    scratch(size);
    var ss = ++B.ss, seen = B.seen, stack = B.stack, sp = 0, reached = 0;
    seen[first] = ss;
    stack[sp++] = first;
    while (sp) {
      i = stack[--sp];
      reached++;
      l = nb[i];
      for (k = 0; k < l.length; k++) {
        var j = l[k];
        if (c[j] && seen[j] !== ss) { seen[j] = ss; stack[sp++] = j; }
      }
    }
    if (reached < tiles) return true;
    var nm = 0;
    for (i = 0; i < size; i++) {
      v = c[i];
      if (v <= 0) continue;
      var hope = false;
      l = nb[i];
      for (k = 0; k < l.length; k++) {
        w = c[l[k]];
        if (w && (w < 0 || w <= v)) { hope = true; break; }
      }
      if (!hope) return true;
      if (v === m) {
        var cnt = 0;
        for (k = 0; k < l.length; k++) { w = c[l[k]]; if (w === m || w < 0) B.cand[i * 4 + cnt++] = l[k]; }
        if (!cnt) return true;
        B.cn[i] = cnt;
        B.mins[nm++] = i;
      }
    }
    // Smallest numbers need distinct partners: bipartite matching on the checkerboard,
    // one colour at a time (Mendelsohn-Dulmage gives a matching covering both).
    if (nm > 1 || wild) {
      for (var side = 0; side < 2; side++) {
        B.os++;
        for (var a = 0; a < nm; a++) {
          var x = B.mins[a];
          if (((((x / n) | 0) + (x % n)) & 1) !== side) continue;
          B.vs++;
          if (!augment(x)) return true;
        }
      }
    }
    if (!wild) {
      var vals = [];
      for (i = 0; i < size; i++) if (c[i] > 0) vals.push(c[i]);
      vals.sort(function (a2, b2) { return a2 - b2; });

  hintBtn.addEventListener('click', requestHint);
  prevBtn.addEventListener('click', function () { if (L > 0) loadLevel(L - 1); });
  nextBtn.addEventListener('click', function () { if (L < LEVELS.length - 1) loadLevel(L + 1); });
  levelsBtn.addEventListener('click', openSheet);
  sheetClose.addEventListener('click', closeSheet);
  winNext.addEventListener('click', function () {
    if (L >= LEVELS.length - 1) { hideWin(); openSheet(); } else loadLevel(L + 1);
  });
  winAgain.addEventListener('click', restart);

  // ---------- level picker ----------
  function openSheet() {
    cancelSearch();
    sheetList.textContent = '';
    var solved = 0, groups = [], i;
    for (i = 0; i < LEVELS.length; i++) {
      var g = groups[groups.length - 1];
      if (!g || g.n !== LEVELS[i].n) groups.push({ n: LEVELS[i].n, from: i, to: i });
      else g.to = i;
    }
    groups.forEach(function (g) {
      var sec = doc.createElement('section');
      sec.className = 'band';
      var h = doc.createElement('h3');
      var b1 = doc.createElement('span');
      b1.textContent = g.n + '×' + g.n;
      var b2 = doc.createElement('small');
      b2.textContent = 'Levels ' + (g.from + 1) + '–' + (g.to + 1);
      h.appendChild(b1);
      h.appendChild(b2);
      var wrap = doc.createElement('div');
      wrap.className = 'dots';
      for (var k = g.from; k <= g.to; k++) {
        var done = !!store.solved[k + 1];
        if (done) solved++;
        var b = doc.createElement('button');
        b.type = 'button';
        b.className = 'dot' + (done ? ' done' : '') + (k === L ? ' current' : '');
        b.setAttribute('data-l', String(k));
        b.setAttribute('aria-label', 'Level ' + (k + 1) + (done ? ', solved' : '') + (store.saves[k + 1] ? ', in progress' : ''));
        b.textContent = String(k + 1);
        if (done) { var tk = doc.createElement('i'); tk.setAttribute('aria-hidden', 'true'); tk.textContent = '✓'; b.appendChild(tk); }
        wrap.appendChild(b);
      }
      sec.appendChild(h);
      sec.appendChild(wrap);
      sheetList.appendChild(sec);
    });
    sheetCount.textContent = solved + ' of ' + LEVELS.length + ' solved';
    lastFocus = doc.activeElement;
    sheet.hidden = false;
    root.classList.add('lock');
    var cur = sheetList.querySelector('[data-l="' + L + '"]');
    if (cur) {
      if (cur.scrollIntoView) cur.scrollIntoView({ block: 'center' });
      cur.focus({ preventScroll: true });
    }
  }
  function closeSheet() {
    sheet.hidden = true;
    root.classList.remove('lock');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  sheetList.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.dot') : null;
    if (!b) return;
    closeSheet();
    loadLevel(+b.getAttribute('data-l'));
  });

  // ---------- global ----------
  doc.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!sheet.hidden) closeSheet();
      else if (sel >= 0) { sel = -1; render(); }
      return;
    }
    if (!sheet.hidden || !winEl.hidden || e.altKey) return;
    var k = (e.key || '').toLowerCase();
    if (k === 'z' || k === 'u') { e.preventDefault(); undo(); }
    else if (k === 'h' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); requestHint(); }
  });
  doc.addEventListener('visibilitychange', function () {
    if (doc.hidden) {
      if (clock.on) { clockStop(); hiddenPause = true; }
      persist();
    } else if (hiddenPause) {
      hiddenPause = false;
      if (!won && hist.length) clockStart();
    }
  });
  window.addEventListener('pagehide', persist);
  if (window.ResizeObserver) new ResizeObserver(function () { if (lv) fit(); }).observe(stageEl);
  else window.addEventListener('resize', function () { if (lv) fit(); });
  if (window.matchMedia) {
    var mq = matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', render); else if (mq.addListener) mq.addListener(render);
  }
  if (window.MutationObserver) new MutationObserver(function () { if (lv) render(); }).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  setInterval(tickClock, 250);

  if (!LEVELS.length) {
    setStatus('No levels yet. Run node tools/generate-levels.js.', 'warn');
    return;
  }
  loadLevel(store.cur);
})();
</script>
</body>
</html>
